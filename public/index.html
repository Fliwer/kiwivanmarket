  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #app-loader::before {
      content: '';
      position: absolute;
      top: -10%;
      right: -10%;
      width: 40%;
      height: 40%;
      background: rgba(16, 185, 129, 0.05);
      border-radius: 50%;
      filter: blur(80px);
      animation: pulse 4s ease-in-out infinite;
    }

    #app-loader::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -10%;
      width: 40%;
      height: 40%;
      background: rgba(20, 184, 166, 0.05);
      border-radius: 50%;
      filter: blur(80px);
      animation: pulse 4s ease-in-out infinite;
      animation-delay: 2s;
    }

    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .loader-logo-wrap {
      width: 96px;
      height: 96px;
      background: #f7eedd;
      border-radius: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.1);
      position: relative;
    }

    .loader-logo-wrap img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      animation: float 3s ease-in-out infinite;
    }

    .loader-logo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 2.5rem;
      border: 2px solid rgba(16, 185, 129, 0.2);
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .loader-brand {
      font-size: 24px;
      font-weight: 900;
      color: #1e293b;
      margin: 0;
      letter-spacing: -0.025em;
    }

    .loader-brand span {
      color: #059669;
    }

    .loader-sub {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .loader-sub::after {
      content: '';
      width: 12px;
      height: 2px;
      background: #10b981;
      border-radius: 1px;
      animation: widthGrow 1.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.4;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.6;
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes ping {

      75%,
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    @keyframes widthGrow {

      0%,
      100% {
        width: 0;
      }

      50% {
        width: 24px;
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }
  </style>
