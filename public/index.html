<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <meta
      name="description"
      content="Kiwi Van Market - New Zealand's Campervan Marketplace"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Kiwi Van Market</title>
    
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        background-image: url('%PUBLIC_URL%/nz-background.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }
      
      /* Overlay sombre pour rendre le texte plus lisible */
      #app-loader::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 1;
      }
      
      .loader-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      
      .loader-van {
        width: 200px;
        height: 200px;
        background: #f7eedd;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        animation: bounce 1s ease-in-out infinite;
        box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        padding: 15px;
        overflow: hidden;
      }
      
      .loader-van img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      .loader-text {
        color: white;
        font-size: 28px;
        font-weight: 700;
        margin-top: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-shadow: 0 4px 12px rgba(0,0,0,0.6);
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      
      .fade-out {
        animation: fadeOut 0.5s forwards;
      }
      
      @keyframes fadeOut {
        to { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Loading Screen -->
    <div id="app-loader">
      <div class="loader-content">
        <div class="loader-van">
          <img src="%PUBLIC_URL%/kiwi-van-logo.png" alt="Kiwi Van Market" />
        </div>
        <div class="loader-spinner"></div>
        <p class="loader-text">Kiwi Van Market</p>
      </div>
    </div>
    
    <div id="root"></div>
  </body>
</html>
